<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mobile CV Hover Preview</title>
  <style>
    body {
      background: #eee;
      padding: 40px;
      font-family: sans-serif;
    }

    /* Phone shell */
    .device {
      position: relative;
      display: flex;
      justify-content: center;
      height: 300px;
      width: 160px;
      border: 4px solid black;
      border-radius: 16px;
      background-color: #f9fafb;
      box-shadow: 5px 5px 2.5px 6px rgb(209, 218, 218);
      overflow: hidden; /* IMPORTANT: clip PDF inside screen */
      cursor: pointer;
    }

    /* Top notch */
    .device-notch {
      position: absolute;
      top: 0;
      width: 80px;
      height: 8px;
      background: black;
      border: 1px solid black;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    /* Side buttons */
    .device-btn {
      position: absolute;
      right: -8px;
      border: 4px solid black;
      border-radius: 6px;
      background: #f9fafb;
      width: 0;
    }

    .device-btn.top {
      top: 56px;
      height: 28px;
    }

    .device-btn.bottom {
      bottom: 144px;
      height: 40px;
    }

    /* PDF screen */
    .device-screen {
      position: absolute;
      inset: 8px; /* padding inside the phone bezel */
      background: white;
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Show on hover */
    .device:hover .device-screen {
      opacity: 1;
    }

    .device-screen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div class="device">
  <span class="device-notch"></span>
  <span class="device-btn top"></span>
  <span class="device-btn bottom"></span>

  <!-- PDF screen -->
  <div class="device-screen">
     <img src="YANN_COHEN_CV.webp" alt="CV Preview" style="width: 100%; height: 100%; object-fit: contain;"> 
  </div>
</div>

</body>
</html>
